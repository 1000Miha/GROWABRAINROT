<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliant Media Interface</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #222;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .trigger-btn {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        #fullscreenElement {
            display: none;
            width: 100%;
            height: 100%;
            background: #000;
            justify-content: center;
            align-items: center;
        }
        :fullscreen #fullscreenElement {
            display: flex;
        }
    </style>
</head>
<body>

    <div class="container" id="landingCard">
        <h2>Media Presentation</h2>
        <p>Click below to view the content in fullscreen mode.</p>
        <button class="trigger-btn" onclick="toggleView()">View Fullscreen</button>
    </div>

    <div id="fullscreenElement">
        <h1 style="color: white;">Fullscreen Presentation Active</h1>
    </div>

    <script>
        const landingCard = document.getElementById('landingCard');
        const fullscreenElement = document.getElementById('fullscreenElement');

        function toggleView() {
            // Request fullscreen on a valid user gesture
            if (fullscreenElement.requestFullscreen) {
                fullscreenElement.requestFullscreen();
            } else if (fullscreenElement.webkitRequestFullscreen) {
                fullscreenElement.webkitRequestFullscreen();
            }
        }

        // Listen for browser fullscreen changes (including pressing Escape)
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                // Adjust interface when entering fullscreen
                landingCard.style.display = 'none';
                fullscreenElement.style.display = 'flex';
            } else {
                // Revert interface naturally when the user exits fullscreen
                fullscreenElement.style.display = 'none';
                landingCard.style.display = 'block';
            }
        });
    </script>
</body>
</html>
