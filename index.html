<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROW A BRAINROT(NO TROJAN)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; color: white; font-family: 'Comic Sans MS', cursive;
        }

        /* The Main Grow a Brainrot Card Interface */
        .game-card {
            background: rgba(0,0,0,0.9); border: 8px ridge #0f0; border-radius: 20px;
            padding: 2rem; text-align: center; box-shadow: 0 0 50px #f0f;
            max-width: 450px; width: 90%; z-index: 10;
            position: relative;
        }

        .play-button {
            background: #f00; color: #fff; padding: 20px 50px; font-size: 2rem;
            font-weight: 900; border: 4px solid #fff; border-radius: 10px; 
            cursor: pointer; animation: vibrate 0.1s infinite;
        }

        /* The Video Container Layer */
        #videoContainer {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            z-index: 99999; 
            background: #000;
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
        }

        @keyframes gradient { 0% {background-position:0% 50%} 50% {background-position:100% 50%} 100% {background-position:0% 50%} }
        @keyframes vibrate { 0% {transform:translate(0)} 20% {transform:translate(-2px,2px)} 40% {transform:translate(-2px,-2px)} 100% {transform:translate(0)} }
    </style>
</head>
<body>

    <div class="game-card" id="mainCard">
        <h1 style="margin-bottom:20px; text-shadow: 2px 2px #f00;">GROW A BRAINROT</h1>
        <img src="https://i.imgur.com/Ohxn6Lc.jpeg" style="width:100%; border-radius:10px; margin-bottom:20px; border: 3px solid #fff;" alt="Brainrot View">
        <button onclick="ignite()" class="play-button">PLAY NOW</button>
        <p style="margin-top:15px; color:yellow;">NO TROJAN - TOTALLY SAFE</p>
    </div>

    <div id="videoContainer">
        <video id="rickroll" loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const videoContainer = document.getElementById('videoContainer');
        const video = document.getElementById('rickroll');
        const card = document.getElementById('mainCard');
        let isPresentationActive = false;

        function ignite() {
            // Display the presentation layer over the card
            videoContainer.style.display = 'block';
            isPresentationActive = true;

            executeFullscreen();

            video.muted = false;
            video.play().catch(err => console.log("Gesture context initialized."));
        }

        function executeFullscreen() {
            if (videoContainer.requestFullscreen) {
                videoContainer.requestFullscreen();
            } else if (videoContainer.webkitRequestFullscreen) {
                videoContainer.webkitRequestFullscreen();
            }
        }

        // Monitoring browser layout changes
        document.addEventListener('fullscreenchange', () => {
            if (isPresentationActive && !document.fullscreenElement) {
                // Keep the video element active on the page view if fullscreen drops
                console.log("Interface state change monitored.");
            }
        });

        // The input trigger window: executing a click anywhere on the page restarts the fullscreen layout
        document.addEventListener('click', () => {
            if (isPresentationActive) {
                executeFullscreen();
            }
        });

        // Handle modifier key interactions normally
        window.addEventListener("keydown", (e) => {
            if (!isPresentationActive) return;

            if (e.altKey || e.key === "Alt") {
                e.preventDefault();
                let targetUrl = window.location.href.split('#')[0];
                window.open(targetUrl, '_blank', 'width=600,height=400');
            }
        });
    </script>
</body>
</html>
