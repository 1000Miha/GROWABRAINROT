<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Presenter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #111;
            height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
            color: white; 
            font-family: sans-serif;
        }

        .container-card {
            background: #222; 
            border: 2px solid #333; 
            border-radius: 12px;
            padding: 2rem; 
            text-align: center;
            max-width: 400px; 
            width: 90%;
        }

        .preview-image {
            width: 100%; 
            border-radius: 8px; 
            margin-bottom: 1.5rem;
        }

        .action-button {
            background: #0070f3; 
            color: #fff; 
            padding: 12px 30px; 
            font-size: 1.2rem;
            border: none; 
            border-radius: 6px; 
            cursor: pointer;
        }

        #videoOverlay {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            background: #000; 
            z-index: 9999;
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }
    </style>
</head>
<body>

    <div class="container-card" id="mainCard">
        <h2 style="margin-bottom: 15px;">Interactive Player</h2>
        <img src="https://i.imgur.com/Ohxn6Lc.jpeg" class="preview-image" alt="Preview">
        <button onclick="startPresentation()" class="action-button">View Fullscreen</button>
    </div>

    <div id="videoOverlay">
        <video id="mainVideo" loop playsinline controls>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const overlay = document.getElementById('videoOverlay');
        const video = document.getElementById('mainVideo');
        const card = document.getElementById('mainCard');

        function startPresentation() {
            // Show the video container
            card.style.display = 'none';
            overlay.style.display = 'block';

            // Unmute and play the video asset
            video.muted = false;
            video.play().catch(err => console.log("Playback pending user interaction context:", err));

            // Request standard fullscreen mode
            if (overlay.requestFullscreen) {
                overlay.requestFullscreen();
            } else if (overlay.webkitRequestFullscreen) {
                overlay.webkitRequestFullscreen();
            }
        }

        // Handle standard exit monitoring to restore the interface gracefully
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                // If user exits fullscreen via Esc or browser controls, restore the card view
                video.pause();
                overlay.style.display = 'none';
                card.style.display = 'block';
            }
        });

        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitIsFullScreen) {
                video.pause();
                overlay.style.display = 'none';
                card.style.display = 'block';
            }
        });
    </script>
</body>
</html>
