<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROW A BRAINROT(NO TROJAN)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        /* The Main UI Card */
        .game-card {
            background: rgba(0, 0, 0, 0.9);
            border: 8px ridge #00ff00;
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 0 50px #ff00ff, inset 0 0 20px #00ffff;
            max-width: 500px;
            width: 95%;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .title {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 4px 4px #ff0000, -3px -3px #0000ff;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            height: 300px;
        }

        .game-icon {
            max-width: 100%;
            max-height: 100%;
            border: 5px solid #fff;
            border-radius: 15px;
            object-fit: cover;
        }

        .play-button {
            background: #ff0000;
            color: white;
            padding: 20px 60px;
            font-size: 2rem;
            font-weight: 900;
            border: 4px solid #fff;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff0000;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            animation: vibrate 0.1s infinite;
        }

        /* Fullscreen Video Styling - Hidden by default */
        #videoOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 999;
        }

        #myVideo {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Set to 'cover' if you want it to fill the whole screen */
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes vibrate {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

    <div class="game-card" id="mainCard">
        <h1 class="title">GROW A BRAINROT</h1>
        
        <div class="image-container">
            <img src="https://i.imgur.com/Ohxn6Lc.jpeg" alt="Brainrot Icon" class="game-icon">
        </div>

        <br>

        <button onclick="goFullscreen()" class="play-button">
            PLAY NOW
        </button>

        <p style="margin-top:25px; color: yellow; font-weight: bold; text-decoration: underline;">
            FULLY SAFE - NO VIRUS - FREE ROBUX INCLUDED
        </p>
    </div>

    <div id="videoOverlay">
        <video id="myVideo" loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        function goFullscreen() {
            const card = document.getElementById('mainCard');
            const overlay = document.getElementById('videoOverlay');
            const video = document.getElementById('myVideo');

            // 1. Hide the card
            card.style.display = 'none';

            // 2. Show the video overlay
            overlay.style.display = 'block';

            // 3. Unmute and Play
            video.muted = false;
            video.play();

            // 4. Trigger browser fullscreen mode
            if (overlay.requestFullscreen) {
                overlay.requestFullscreen();
            } else if (overlay.webkitRequestFullscreen) { /* Safari */
                overlay.webkitRequestFullscreen();
            } else if (overlay.msRequestFullscreen) { /* IE11 */
                overlay.msRequestFullscreen();
            }
        }
    </script>

</body>
</html>
