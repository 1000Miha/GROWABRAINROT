<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standard Media Presenter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #121212;
            color: #ffffff;
            font-family: sans-serif;
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .card {
            background: #1e1e1e; border: 2px solid #333; border-radius: 10px;
            padding: 2rem; text-align: center; max-width: 400px; width: 90%;
        }
        .preview { width: 100%; border-radius: 6px; margin-bottom: 1.5rem; }
        .btn {
            background: #0070f3; color: white; padding: 12px 24px; font-size: 1.1rem;
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        #overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 999;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2 style="margin-bottom: 15px;">Media Control Interface</h2>
        <img src="https://i.imgur.com/Ohxn6Lc.jpeg" class="preview" alt="Preview Image">
        <button onclick="enterPresentation()" class="btn">Play Fullscreen</button>
    </div>

    <div id="overlay">
        <video id="displayVideo" loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const overlay = document.getElementById('overlay');
        const video = document.getElementById('displayVideo');
        const card = document.getElementById('mainCard');

        function enterPresentation() {
            card.style.display = 'none';
            overlay.style.display = 'block';

            // Start video playback
            video.muted = false;
            video.play().catch(err => console.log("Playback context initiated."));

            // Standard permission request for fullscreen configuration
            if (overlay.requestFullscreen) {
                overlay.requestFullscreen();
            } else if (overlay.webkitRequestFullscreen) {
                overlay.webkitRequestFullscreen();
            }
        }

        // Standard exit tracking to sync the application state smoothly
        function monitorExit() {
            if (!document.fullscreenElement && !document.webkitIsFullScreen) {
                video.pause();
                overlay.style.display = 'none';
                card.style.display = 'block';
            }
        }

        document.addEventListener('fullscreenchange', monitorExit);
        document.addEventListener('webkitfullscreenchange', monitorExit);
    </script>
</body>
</html>
